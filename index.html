<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Counting Down... ⏳</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            background-color: #f0e6ff;
            background-image: 
                linear-gradient(#fff5f8 2px, transparent 2px),
                linear-gradient(90deg, #fff5f8 2px, transparent 2px);
            background-size: 30px 30px;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            color: #4a3b5c;
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        /* Floating background items */
        .heart-particle {
            position: absolute;
            pointer-events: none;
            font-size: 1.3rem;
            animation: riseUp 4s linear forwards;
            opacity: 0;
            z-index: 1;
        }

        @keyframes riseUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        @keyframes bounceIn {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            border: 3.5px solid #4a3b5c;
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 6px 6px 0px #4a3b5c;
            text-align: center;
            animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 10;
            background-image: radial-gradient(#fff5f8 12%, transparent 13%);
            background-size: 14px 14px;
        }

        .status-badge {
            font-size: 0.75rem;
            background: #4a3b5c;
            color: #fff;
            padding: 3px 10px;
            border-radius: 6px;
            display: inline-block;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: #ff6b8b;
            text-shadow: 2px 2px 0px #fff;
            line-height: 1.3;
        }

        .subtitle {
            margin: 8px 0 25px 0;
            font-size: 0.9rem;
            font-style: italic;
            color: #7b8fa8;
        }

        /* Countdown Timer Grid Layout */
        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .time-box {
            background: #ffe3ec;
            border: 2.5px solid #4a3b5c;
            border-radius: 14px;
            padding: 12px 5px;
            box-shadow: 3px 3px 0px #4a3b5c;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-box:nth-child(even) {
            background: #e8f7ff;
        }

        .time-box .num {
            font-size: 1.6rem;
            font-weight: bold;
            color: #4a3b5c;
        }

        .time-box .label {
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #7b8fa8;
            margin-top: 2px;
        }

        /* Call-To-Action Button Container */
        .action-container {
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .enter-btn {
            background: #fff;
            border: 3px solid #4a3b5c;
            border-radius: 16px;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: inherit;
            color: #ff6b8b;
            cursor: pointer;
            box-shadow: 4px 4px 0px #4a3b5c;
            transition: all 0.2s ease;
            text-decoration: none;
            display: none;
            animation: bounceIn 0.5s ease forwards;
        }

        .enter-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 0px 0px 0px;
        }

        .message-box {
            font-size: 1rem;
            font-weight: bold;
            color: #ff6b8b;
            line-height: 1.4;
            background: #fff9db;
            border: 2.5px dashed #ff6b8b;
            border-radius: 12px;
            padding: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-badge" id="portal-status">LOADING TICKER... ⏳</div>
        <h1 id="main-heading">Something special is cooking... 🥺</h1>
        <p class="subtitle" id="sub-heading">hold your patience, the countdown is ticking down for 16 July! ✨</p>

        <!-- COUNTDOWN DISPLAY -->
        <div class="timer-grid" id="timer-display">
            <div class="time-box">
                <span class="num" id="days">00</span>
                <span class="label">Days</span>
            </div>
            <div class="time-box">
                <span class="num" id="hours">00</span>
                <span class="label">Hrs</span>
            </div>
            <div class="time-box">
                <span class="num" id="minutes">00</span>
                <span class="label">Mins</span>
            </div>
            <div class="time-box">
                <span class="num" id="seconds">00</span>
                <span class="label">Secs</span>
            </div>
        </div>

        <!-- DYNAMIC BOTTOM INTERACTION CONTAINER -->
        <div class="action-container">
            <div class="message-box" id="waiting-msg">
                "i promise the wait will be 100% worth it babe... stay tuned! 🧸❤️"
            </div>
            <!-- Main target access dashboard path route aligned here directly -->
            <a href="https://kkaxhyap.github.io/mahiiibday/mahi.html" class="enter-btn" id="redirect-btn">
                Enter Mahi's World ✨
            </a>
        </div>
    </div>

    <script>
        // TARGET DEADLINE CONFIGURATION: 16 July 2026 00:00:00
        const targetDate = new Date("July 16, 2026 00:00:00").getTime();

        const countdownInterval = setInterval(function() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            // Calculations for Time Elements
            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / 1000);

            // Print numbers into DOM container layout
            document.getElementById("days").innerText = d < 10 ? "0" + d : d;
            document.getElementById("hours").innerText = h < 10 ? "0" + h : h;
            document.getElementById("minutes").innerText = m < 10 ? "0" + m : m;
            document.getElementById("seconds").innerText = s < 10 ? "0" + s : s;

            // Update loading state badge
            if (difference > 0) {
                document.getElementById("portal-status").innerText = "HYPE MODE: ACTIVE ⏰";
            }

            // ACTION CONTROLLER ON DEADLINE EXPIRY
            if (difference <= 0) {
                clearInterval(countdownInterval);
                
                // Set final default numbers
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";

                // UI Layout Transformation Engine
                document.getElementById("portal-status").innerText = "PORTAL OPEN: UNLOCKED 🔓";
                document.getElementById("portal-status").style.background = "#ff6b8b";
                document.getElementById("main-heading").innerText = "The Wait Is Over! 🎉";
                document.getElementById("sub-heading").innerText = "mahi's customized private vault is now completely unlocked for you...";
                
                // Toggle Element Display Tiers
                document.getElementById("waiting-msg").style.display = "none";
                document.getElementById("redirect-btn").style.display = "inline-block";
            }
        }, 1000);

        // FLOATING GRAPHIC HEART PARTICLES GENERATOR
        function createHeartParticle() {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            const heartIcons = ['❤️', '✨', '🌸', '💖', '🧸', '🥰'];
            heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
            
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 1.5 + 3) + 's'; 
            
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 4000);
        }
        setInterval(createHeartParticle, 400);
    </script>
</body>
</html>
